name: CI

# One qualification run per landing candidate: the commit is pushed to `kci/<sha>`,
# the `qualified` job below is its verdict, and only then does master move to it.
# Nothing else starts this workflow, and no path filter narrows it: a candidate
# with no run can never land.
on:
  push:
    branches: ['kci/**']

permissions:
  contents: read

# Every step runs as bash -eo pipefail; a failure behind a pipe fails its step.
defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MIX_ENV: test

jobs:
  # .tool-versions is the only home for runtime versions: its first version of
  # each tool is the default every job below runs on, and every other listed
  # Elixir build, paired with its Erlang by OTP major, is a compatibility lane.
  toolchain:
    name: Read suite toolchains
    runs-on: ubuntu-24.04
    timeout-minutes: 5 # run 44201139874
    outputs:
      elixir: ${{ steps.versions.outputs.elixir }}
      otp: ${{ steps.versions.outputs.otp }}
      beam_lanes: ${{ steps.versions.outputs.beam_lanes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read defaults and compatibility lanes
        id: versions
        run: scripts/toolchain.sh >> "$GITHUB_OUTPUT"

  lint:
    name: Lint
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 5 # run 44201139874
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-beam
        with:
          elixir-version: ${{ needs.toolchain.outputs.elixir }}
          otp-version: ${{ needs.toolchain.outputs.otp }}

      - run: mix deps.get --check-locked
      - run: mix format --check-formatted
      - run: mix credo --strict
      - run: mix deps.unlock --check-unused
      - run: mix hex.audit
      - run: mix deps.audit

  compile:
    name: Compile and docs
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 7 # run 44201139874
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-beam
        with:
          elixir-version: ${{ needs.toolchain.outputs.elixir }}
          otp-version: ${{ needs.toolchain.outputs.otp }}

      - run: mix deps.get --check-locked
      - run: mix compile --warnings-as-errors
      - run: MIX_ENV=dev mix docs

  test:
    name: Test
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 5 # run 44201139874
    services:
      age:
        # Pinned by digest for reproducible AGE behavior (apache/age:release_PG16_1.6.0,
        # AGE 1.6.0 / PostgreSQL 16). A floating tag makes graph-behavior CI non-reproducible.
        image: apache/age@sha256:16aa423d20a31aed36a3313244bf7aa00731325862f20ed584510e381f2feaed
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ash_age_test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      AGE_DATABASE_URL: postgres://postgres:postgres@localhost:5432/ash_age_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-beam
        with:
          elixir-version: ${{ needs.toolchain.outputs.elixir }}
          otp-version: ${{ needs.toolchain.outputs.otp }}

      - run: mix deps.get --check-locked
      - run: mix test

  dialyzer:
    name: Dialyzer
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 10 # run 44201139874
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-beam
        with:
          elixir-version: ${{ needs.toolchain.outputs.elixir }}
          otp-version: ${{ needs.toolchain.outputs.otp }}

      - run: mix deps.get --check-locked
      - run: mix dialyzer

  notebook:
    name: Notebook
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 5 # run 44201139874
    services:
      age:
        image: apache/age@sha256:16aa423d20a31aed36a3313244bf7aa00731325862f20ed584510e381f2feaed
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ash_age_test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      AGE_DATABASE_URL: postgres://postgres:postgres@localhost:5432/ash_age_test
      ASH_AGE_SRC: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-beam
        with:
          elixir-version: ${{ needs.toolchain.outputs.elixir }}
          otp-version: ${{ needs.toolchain.outputs.otp }}

      - run: elixir scripts/run_notebook.exs notebooks/getting_started.livemd

  # The declared floor (elixir in mix.exs) as a consumer meets it: the toolchain
  # in ci/floor/.tool-versions, the committed production lock, and the package
  # compiled with warnings as errors. No qualification lane may rewrite a lock.
  floor:
    name: Floor
    runs-on: ubuntu-24.04
    timeout-minutes: 5 # run 44201139874
    env:
      MIX_ENV: prod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the floor toolchain
        id: versions
        run: scripts/toolchain.sh ci/floor/.tool-versions >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-beam
        with:
          elixir-version: ${{ steps.versions.outputs.elixir }}
          otp-version: ${{ steps.versions.outputs.otp }}
          tool-versions: ci/floor/.tool-versions

      - run: mix deps.get --only prod --check-locked
      - run: mix compile --warnings-as-errors

  # Every other Elixir and Erlang pair .tool-versions lists: compile, the suite
  # with AGE and Dialyzer. Lint, docs and the notebook run once, on the default.
  compatibility:
    name: Compatibility (Elixir ${{ matrix.elixir }}, OTP ${{ matrix.otp }})
    needs: toolchain
    if: needs.toolchain.outputs.beam_lanes != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 11 # run 44201139874
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.toolchain.outputs.beam_lanes) }}
    services:
      age:
        image: apache/age@sha256:16aa423d20a31aed36a3313244bf7aa00731325862f20ed584510e381f2feaed
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ash_age_test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      AGE_DATABASE_URL: postgres://postgres:postgres@localhost:5432/ash_age_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-beam
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - run: mix deps.get --check-locked
      - run: mix compile --warnings-as-errors
      - run: mix test
      - run: mix dialyzer

  # The one verdict a landing reads: every job above succeeded. A skipped,
  # canceled, or failed prerequisite refuses qualification.
  qualified:
    name: qualified
    if: always()
    needs: [toolchain, lint, compile, test, dialyzer, notebook, floor, compatibility]
    runs-on: ubuntu-24.04
    timeout-minutes: 5 # run 44201139874
    steps:
      - name: Require every qualification job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os, sys
          results = json.loads(os.environ['NEEDS'])
          failed = [name for name, job in results.items() if job['result'] != 'success']
          if failed:
              print('Qualification refused: ' + ', '.join(failed))
          sys.exit(bool(failed) or not results)
          PYTHON
