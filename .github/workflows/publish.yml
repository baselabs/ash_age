name: Publish to Hex.pm

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

env:
  MIX_ENV: dev
  HEX_API_URL: https://hex.pm/api

jobs:
  publish:
    name: Publish
    if: contains(fromJSON('["corepay","palermo-git"]'), github.actor) && contains(fromJSON('["corepay","palermo-git"]'), github.triggering_actor)
    environment: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 5 # run 39079831016
    steps:
      - name: Refuse a ref other than the default branch
        env:
          DEFAULT_REF: refs/heads/${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_REF" != "$DEFAULT_REF" ]; then
            echo "::error::Run this workflow from the default branch."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-beam

      - name: Pin the Hex client used to build and publish
        run: mix local.hex 2.7.0 --force

      - name: Fetch locked dependencies
        run: mix deps.get --check-locked

      - name: Read the package identity
        run: |
          mix run --no-start -e '
            config = Mix.Project.config()
            package = to_string(Keyword.get(config[:package] || [], :name, config[:app]))
            version = config[:version]
            Version.parse!(version)
            File.write!(System.fetch_env!("GITHUB_ENV"),
              "PACKAGE=#{package}\nVERSION=#{version}\n" <>
              "PACKAGE_ARCHIVE=#{System.fetch_env!("RUNNER_TEMP")}/#{package}-#{version}.tar\n" <>
              "DOCS_ARCHIVE=#{System.fetch_env!("RUNNER_TEMP")}/hex-docs.tar.gz\n", [:append])
          '

      - name: Refuse a package name the registry has never had
        run: |
          python3 - <<'PYTHON'
          import http.client, os, urllib.error, urllib.parse, urllib.request
          name = os.environ['PACKAGE']
          package = urllib.parse.quote(name, safe='')
          package_url = f'https://hex.pm/api/packages/{package}'
          try:
              with urllib.request.urlopen(package_url, timeout=30) as response:
                  if response.status != 200:
                      raise SystemExit(f'::error::Hex.pm registry could not be read for {name} (HTTP {response.status})')
          except urllib.error.HTTPError as error:
              if error.code == 404:
                  raise SystemExit(
                      f'::error::{name} has never been published to Hex.pm: '
                      'this workflow publishes new versions of existing packages only. '
                      "A first publication is the owner's decision.")
              raise SystemExit(f'::error::Hex.pm registry could not be read for {name} (HTTP {error.code})')
          except (OSError, http.client.HTTPException):
              raise SystemExit(f'::error::Hex.pm registry could not be read for {name}')
          PYTHON

      - name: Refuse an existing version tag or Hex release
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" "refs/tags/${VERSION}"; then
            echo "::error::This version already has a tag."
            exit 1
          else
            status=$?
            [ "$status" -eq 2 ] || exit "$status"
          fi
          python3 - <<'PYTHON'
          import os, urllib.error, urllib.parse, urllib.request
          package = urllib.parse.quote(os.environ['PACKAGE'], safe='')
          version = urllib.parse.quote(os.environ['VERSION'], safe='')
          url = f'https://hex.pm/api/packages/{package}/releases/{version}'
          try:
              with urllib.request.urlopen(url, timeout=30):
                  pass
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise SystemExit(f'::error::Hex version lookup failed (HTTP {error.code})')
          except urllib.error.URLError:
              raise SystemExit('::error::Hex version lookup failed')
          else:
              raise SystemExit('::error::This version is already published on Hex.pm')
          PYTHON

      - name: Build documentation
        run: |
          mix docs --warnings-as-errors
          test -s doc/index.html
          tar -C doc -czf "$DOCS_ARCHIVE" .

      - name: Build and inspect the exact release archive
        run: |
          mix hex.build --output "$PACKAGE_ARCHIVE"
          tar -tf "$PACKAGE_ARCHIVE"
          tar -xOf "$PACKAGE_ARCHIVE" contents.tar.gz | tar -tzf -
          sha256sum "$PACKAGE_ARCHIVE" "$DOCS_ARCHIVE" > "$RUNNER_TEMP/hex-publish.sha256"

      - name: Publish the inspected package and documentation bytes
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: |
          test -n "$HEX_API_KEY"
          sha256sum --check "$RUNNER_TEMP/hex-publish.sha256"
          # hex.publish rebuilds its archive. The same Hex APIs upload these inspected bytes.
          # No project or dependency code runs in the process holding the publishing key.
          mix run --no-mix-exs --no-start -e '
            Hex.start()
            auth = [key: System.fetch_env!("HEX_API_KEY")]
            published! = fn
              {:ok, {_status, _, %{"status" => "staged"}}} ->
                Mix.raise("Hex staged publication for approval; publication is incomplete")
              {:ok, {status, _, _}} when status in 200..299 -> :ok
              _ -> Mix.raise("Hex publication failed")
            end
            Hex.API.Release.publish(nil, File.read!(System.fetch_env!("PACKAGE_ARCHIVE")),
              auth, fn _ -> nil end, replace: false) |> published!.()
            Hex.API.ReleaseDocs.publish(nil, System.fetch_env!("PACKAGE"),
              System.fetch_env!("VERSION"), File.read!(System.fetch_env!("DOCS_ARCHIVE")), auth)
              |> published!.()
          '
