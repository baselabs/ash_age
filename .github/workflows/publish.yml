name: Publish to Hex.pm

on:
  workflow_dispatch:

env:
  MIX_ENV: dev

jobs:
  publish:
    name: Publish
    # The Hex key lives only in the protected publish environment, and only an
    # owner's dispatch from the default branch, and re-run if at all, may use it.
    if: contains(fromJSON('["corepay","palermo-git"]'), github.actor) && contains(fromJSON('["corepay","palermo-git"]'), github.triggering_actor) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Read the default toolchain
        id: versions
        run: sh scripts/toolchain.sh >> "$GITHUB_OUTPUT"

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          elixir-version: ${{ steps.versions.outputs.elixir }}
          otp-version: ${{ steps.versions.outputs.otp }}

      - run: mix deps.get
      - run: mix hex.publish --yes
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
